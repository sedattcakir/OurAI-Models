model:
  name: "OurLLM-v0.2"
  type: "decoder-only-transformer"
  vocab_size: 16000
  embedding_dim: 256
  num_layers: 6
  num_heads: 4
  feedforward_dim: 1024
  max_seq_length: 512
  dropout: 0.1

training:
  batch_size: 8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  max_steps: 30000
  gradient_accumulation_steps: 4
  mixed_precision: true
  checkpoint_interval: 5000
  eval_interval: 500
  log_interval: 100
  lr_scheduler: "cosine"
  min_lr: 1.0e-5

tokenizer:
  type: "bpe"
  vocab_size: 16000
  min_frequency: 2
  special_tokens:
    - "<pad>"
    - "<unk>"
    - "<bos>"
    - "<eos>"

data:
  train_split: 0.95
  eval_split: 0.05
  max_length: 512
