model:
  name: "OurLLM-v0.1"
  type: "decoder-only-transformer"
  vocab_size: 8000
  embedding_dim: 256
  num_layers: 6
  num_heads: 4
  feedforward_dim: 1024
  max_seq_length: 512
  dropout: 0.1

training:
  batch_size: 8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 10000
  gradient_accumulation_steps: 4
  mixed_precision: true
  checkpoint_interval: 1000
  eval_interval: 500
  log_interval: 50

tokenizer:
  type: "bpe"
  vocab_size: 8000
  min_frequency: 2
  special_tokens:
    - "<pad>"
    - "<unk>"
    - "<bos>"
    - "<eos>"

data:
  train_split: 0.9
  eval_split: 0.1
  max_length: 512
